name: Reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Download the official dataset (SHA-256 verified)
        run: python scripts/get_data.py
      - name: Tests (synthetic unit tests + dataset regression, incl. submission.json is reproduced exactly)
        run: python -m pytest -q
      - name: Regenerate and validate the submission
        run: |
          python -m straightrows submit --data data --output regenerated.json \
            --github-handle shanesherman --repo-url https://github.com/shanesherman/straight-rows
          python -m straightrows validate regenerated.json
          python -c "import json,sys; a=json.load(open('regenerated.json')); b=json.load(open('submission.json')); sys.exit(a!=b)"
      - name: Development-window score with the official scorer
        run: python -m straightrows evaluate --data data
